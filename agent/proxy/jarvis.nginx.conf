# Nginx foran Jarvis-agenten.
#
#   sudo cp jarvis.nginx.conf /etc/nginx/sites-available/jarvis
#   sudo ln -s /etc/nginx/sites-available/jarvis /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#
# Sertifikat: enten certbot (`sudo certbot --nginx -d jarvis.dittdomene.no`)
# eller selvsignert via ../scripts/make-cert.sh.

# Alt på HTTP sendes videre til HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name jarvis.dittdomene.no;
    return 308 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name jarvis.dittdomene.no;

    ssl_certificate     /etc/letsencrypt/live/jarvis.dittdomene.no/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jarvis.dittdomene.no/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # Agenten gjør sin egen rate-limiting, men et tak i Nginx skader ikke.
    client_max_body_size 6m;

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # Uten disse ser agenten alle kall som å komme fra 127.0.0.1,
        # og rate-limiting per IP virker ikke.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
